[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
# 팀 공용 저장소라서 내가 맡은 ingest/, scripts/, tests/만 검사한다.
include = ["ingest/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ingest"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
